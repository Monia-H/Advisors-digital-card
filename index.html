<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Digital Business Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <!-- Optional: Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="avatar-wrapper">
        <!-- Replace avatar.png with your own image file in the repo -->
        <img src="profile.png" alt="Your profile photo" class="avatar" />
      </div>

      <h1 class="name">Your Name</h1>
      <p class="title">Your Role / Title</p>
      <p class="company">Your Company or School</p>

      <p class="tagline">
        Short tagline about you. For example: “CS student & aspiring SWE interested in AI, web dev, and embedded systems.”
      </p>

      <div class="button-row">
        <a class="btn primary" href="mailto:you@example.com">Email Me</a>
        <a class="btn outline" href="https://www.linkedin.com/in/your-profile" target="_blank" rel="noopener">
          LinkedIn
        </a>
      </div>

      <div class="links">
        <a href="https://github.com/your-username" target="_blank" rel="noopener">GitHub</a>
        <span>•</span>
        <a href="https://your-portfolio-site.com" target="_blank" rel="noopener">Portfolio</a>
        <span>•</span>
        <a href="tel:+11234567890">Call</a>
      </div>

      <div class="footer-note">
        <p>Scan or tap to save this card.</p>
        <!-- If you generate a QR code PNG, save it as qr.png in the repo -->
        <img src="qr.png" alt="QR code to this page" class="qr" />
      </div>
    </section>
  </main>
</body>
</html>
